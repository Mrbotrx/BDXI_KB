name: "📺 IPTV LINKS BY KBCT"

run-name: "IPTV LINKS BY KBCT • ${{ inputs.mode || 'fast' }} build"

on:
  schedule:
    - cron: "17 */3 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select playlist build mode"
        type: choice
        options:
          - fast
          - full
        default: fast
        required: true

permissions:
  contents: write

concurrency:
  group: kbc-playlist
  cancel-in-progress: false

jobs:
  build:
    name: "📡 IPTV LINKS BY KBCT — Build Playlist"
    runs-on: ${{ vars.KBC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    env:
      TZ: Asia/Dhaka
      BOT_NAME: "IPTV LINKS BY KBCT"
      LOGO_URL: "https://raw.githubusercontent.com/Mrbotrx/Mrbotrx/refs/heads/main/IPTV_LINKS_LOGO.jpg"
      MODE: ${{ inputs.mode || vars.KBC_MODE || 'fast' }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v5

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "📺 Display Bot Information"
        run: |
          echo "=================================="
          echo "$BOT_NAME"
          echo "Mode: $MODE"
          echo "Logo: $LOGO_URL"
          echo "=================================="
          python3 --version

      - name: "⚙️ Build Playlist"
        shell: bash
        run: |
          set -euo pipefail

          ARGS=(--no-cache --no-report --split)

          if [[ "$MODE" == "full" ]]; then
            ARGS+=(--timeout 10)
          else
            ARGS+=(--fast --timeout 12)
          fi

          # Use the actual script filename in your repository.
          if [[ -f KBC_playlist.py ]]; then
            SCRIPT="KBC_playlist.py"
          elif [[ -f kbc_iptv.py ]]; then
            SCRIPT="kbc_iptv.py"
          else
            echo "ERROR: Playlist Python script not found."
            ls -la
            exit 1
          fi

          echo "Running: $SCRIPT"
          python3 "$SCRIPT" "${ARGS[@]}"

      - name: "🔎 Verify Playlist"
        shell: bash
        run: |
          set -euo pipefail

          PLAYLIST="KBC/KBC_playlist.m3u"

          if [[ ! -f "$PLAYLIST" ]]; then
            echo "ERROR: $PLAYLIST was not created."
            find . -maxdepth 3 -type f
            exit 1
          fi

          CHANNELS=$(grep -c '^#EXTINF' "$PLAYLIST" || true)

          if [[ "$CHANNELS" -eq 0 ]]; then
            echo "ERROR: Playlist has no channels."
            exit 1
          fi

          echo "Playlist verified."
          echo "Channel count: $CHANNELS"

      - name: "📝 Add Logo and Bot Information to Summary"
        if: always()
        shell: bash
        run: |
          {
            echo "# 📺 IPTV LINKS BY KBCT"
            echo
            echo "![IPTV LINKS BY KBCT]($LOGO_URL)"
            echo
            echo "**Bot:** $BOT_NAME"
            echo
            echo "**Mode:** $MODE"
            echo
            echo "**Updated:** $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo

            if [[ -f KBC/KBC_playlist.m3u ]]; then
              CHANNELS=$(grep -c '^#EXTINF' KBC/KBC_playlist.m3u || true)
              echo "**Channels:** $CHANNELS"
              echo
              UPDATED=$(grep -m1 '^# Updated' KBC/KBC_playlist.m3u || true)

              if [[ -n "$UPDATED" ]]; then
                echo "$UPDATED"
              fi
            else
              echo "Playlist output not found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "🚀 Commit and Push Playlist"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add KBC/

          if git diff --cached --quiet; then
            echo "No playlist changes to commit."
            exit 0
          fi

          git commit -m "Update IPTV LINKS BY KBCT playlist $(date '+%Y-%m-%d %H:%M') BD"

          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" &&
               git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Playlist pushed successfully."
              exit 0
            fi

            echo "Push failed: attempt $i"
            sleep 5
          done

          echo "ERROR: Could not push changes."
          exit 1
