name: KB IPTV Auto Update

on:

  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate KB IPTV
        env:
          CHANNELS_API: ${{ secrets.CHANNELS_API }}
          STREAMS_API: ${{ secrets.STREAMS_API }}
          LOGOS_API: ${{ secrets.LOGOS_API }}
        run: |
          node scripts/generate.js

      - name: Commit Generated Files
        run: |

          git config user.name "KB IPTV Bot"

          git config user.email "actions@github.com"

          git add api/api.json
          git add playlists/*.m3u8

          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit -m "Auto update KB IPTV"

            git push

          fi
